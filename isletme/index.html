<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f2"><link rel="icon" href="../assets/sadakatqr-icon.svg" type="image/svg+xml"><title>SadakatQR · İşletme Paneli</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#332720;background:#fff8f2}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:22px 18px 85px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:850}.brand img{width:37px;height:37px;object-fit:cover;border-radius:10px}.brand b{color:#e86b37}.head a{font-size:12px;color:#8a5a46;text-decoration:none}.hero{margin:25px 0 18px;background:linear-gradient(125deg,#593a32,#a55e49 65%,#ed8958);color:white;border-radius:23px;padding:23px}.hero small{color:#ffdac5}.hero h1{font-size:25px;margin:10px 0 7px}.hero p{margin:0;color:#ffe7da;font-size:13px}.banner{margin:14px 0;background:#fff0df;border:1px solid #f7cfaa;color:#864b28;border-radius:13px;padding:12px;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #f0dfd3;border-radius:18px;background:white;text-align:left;min-height:130px;padding:16px;color:#413027;cursor:pointer;display:flex;flex-direction:column;gap:8px}.tile .emoji{font-size:27px}.tile strong{font-size:15px}.tile small{font-size:11px;color:#8e7869}.tile:focus-visible,.tabs button:focus-visible{outline:3px solid #ed814f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 21px}.stat{border:1px solid #f0dfd3;border-radius:13px;background:#fff;padding:12px;text-align:center}.stat b{display:block;font-size:23px;color:#e76d3c}.stat small{font-size:11px;color:#8a7466}.section{border:1px solid #efded2;background:#fff;border-radius:19px;padding:20px;margin-top:17px}.section h2{font-size:20px;margin:0 0 9px}.section p{font-size:13px;color:#7b665c;line-height:1.6}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tabs button{border:0;border-radius:10px;background:#ffede0;color:#975d43;padding:11px 13px;font-weight:750;cursor:pointer}.tabs button.active{background:#f07a43;color:#fff}.button{background:#f07842;color:#fff;border:0;padding:13px 16px;border-radius:12px;font-weight:750;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}.field{display:block;margin:13px 0;font-size:13px;font-weight:750}.field input{margin-top:7px;width:100%;border:1px solid #e7cabb;border-radius:12px;padding:13px;font:inherit;min-height:45px}.notice{background:#fff7ee;padding:13px;border-radius:12px;font-size:13px;color:#80573e}.hidden{display:none}.footer{text-align:center;color:#977d70;font-size:11px;padding:23px}.customer-card{border:1px dashed #e6ba9d;padding:15px;border-radius:14px;margin-top:13px}.empty{padding:20px 10px;text-align:center;color:#977d70;font-size:13px}@media(min-width:700px){.app{padding-top:35px}.hero{padding:35px}.hero h1{font-size:31px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:145px}}@media(max-width:380px){.tile{padding:12px}.tile strong{font-size:13px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><img src="../assets/sadakatqr-icon.svg" alt="">Sadakat<b>QR</b></div><a href="../">← Müşteri sayfası</a></header>
<section class="hero"><small>İŞLETME YÖNETİMİ</small><h1>İşletme Paneli</h1><p>QR okuma, damga, kampanya ve ödüller için tek ekran.</p></section>
<div class="banner">🔒 <b>Güvenli test modu:</b> Henüz işletme yetkilendirmesi kurulmadı. Bu ekrandan gerçek damga veya ödül işlemi yapılmaz.</div>
<div class="stats"><div class="stat"><b>—</b><small>Müşteri</small></div><div class="stat"><b>—</b><small>Damga</small></div><div class="stat"><b>—</b><small>Ödül</small></div></div>
<div class="grid" id="features"></div><section class="section" id="content" aria-live="polite"></section>
<div class="footer">SadakatQR · İşletme paneli geliştirme sürümü</div></main>
<script>
const cards=[['scan','📷','QR Okut','Müşterinin kodunu tara'],['stamp','⭐','Damga Ver','Onaylı ziyaret işlemleri'],['reward','🎁','Ödül Onayla','Hak edilen hediyeler'],['customers','👥','Müşterilerim','Üyeler ve hareketler'],['campaigns','📣','Kampanyalarım','Kurallar ve süreler'],['reports','📊','Raporlar','İşletme istatistikleri']];
const contents={
scan:['Müşteri QR Kodunu Okut','Müşterinin SadakatQR kodunu işletme cihazıyla okutmak için güvenli okuyucu burada açılacak.','Kamerayla Okutma','Kamera erişimi, giriş ve işletme yetkisi doğrulandıktan sonra etkinleşecek.'],
stamp:['Damga Ver','Yalnızca işletmeye bağlı müşteri ve etkin kampanya seçilerek damga verilecek.','Damga İşlemi','İşlem sunucuda doğrulanacak; tekrar veya yetkisiz onay engellenecek.'],
reward:['Ödül Onayla','Kazanılan hediyeler bu bölümde doğrulanarak tek kullanımlık olarak onaylanacak.','Bekleyen Ödüller','Henüz bağlı ödül kaydı yok.'],
customers:['Müşterilerim','İşletmenize katılan müşterileri ve ziyaret geçmişlerini burada görüntüleyeceksiniz.','Müşteri Listesi','Henüz bağlı müşteri kaydı yok.'],
campaigns:['Kampanyalarım','Ödül adı, gerekli damga sayısı ve kampanya koşulları burada yönetilecek.','Kampanya Ayarları','Gerçek veritabanı bağlantısının ardından etkinleştirilecek.'],
reports:['Raporlar','Günlük ziyaret, verilen damga ve kullanılan ödülleri izleyebileceksiniz.','İstatistikler','Henüz raporlanacak gerçek işlem yok.']
};
const featureRoot=document.getElementById('features'),content=document.getElementById('content');
featureRoot.innerHTML=cards.map(c=>'<button class="tile" type="button" data-page="'+c[0]+'"><span class="emoji">'+c[1]+'</span><strong>'+c[2]+'</strong><small>'+c[3]+'</small></button>').join('');
function show(page){const d=contents[page]||contents.scan;featureRoot.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));content.innerHTML='<h2>'+d[0]+'</h2><p>'+d[1]+'</p><div class="customer-card"><strong>'+d[2]+'</strong><p>'+d[3]+'</p></div><p class="notice">🔐 Güvenlik nedeniyle bu bölüm yalnızca bilgilendirme modunda. İşletme yetkisi ve sunucu onayı olmadan işlem yapılmaz.</p>';content.scrollIntoView({behavior:'smooth',block:'nearest'})}
featureRoot.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)show(b.dataset.page)});show('scan');
</script></body></html>
