<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SadakatQR · Ana Yönetim</title><link rel="icon" href="../assets/sadakatqr-icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#fbf5ef;font:15px system-ui;color:#38271f}main{max-width:1000px;margin:auto;padding:20px 15px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}header img{width:37px;vertical-align:middle;border-radius:8px}a{color:#a15a35;text-decoration:none}.hero{background:linear-gradient(110deg,#49312b,#c1774c);color:white;padding:24px;border-radius:20px;margin:20px 0}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0;font-size:13px}.box{border:1px solid #ead5c7;border-radius:17px;padding:19px;background:white;margin:12px 0}input,button,select{font:inherit}input{display:block;width:100%;padding:13px;border:1px solid #ddc6b6;border-radius:11px;margin:7px 0 13px}.button{background:#e97840;border:0;color:white;font-weight:750;padding:12px 17px;border-radius:12px;cursor:pointer}.button:disabled{opacity:.5}label{font-size:13px;font-weight:750}#msg{font-size:13px;color:#985b3c}#app{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{padding:11px 15px;background:#ffeddf;border:0;border-radius:10px;cursor:pointer;font-weight:700}.tabs button.active{background:#e97840;color:white}.card{border:1px solid #ebd7c8;border-radius:14px;padding:15px;margin:10px 0;background:white}.card h3{margin:0 0 8px}.card small{display:block;color:#8a756a;margin:5px 0}.status{display:inline-block;background:#fff0df;border-radius:20px;padding:6px 10px;margin:8px 0;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{border:1px solid #eacdbb;background:#fff7ef;border-radius:9px;padding:9px;font-weight:650;cursor:pointer}.empty{color:#987b6a;padding:25px;text-align:center}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(min-width:700px){.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{margin:0}} .forgot-link{display:block;width:100%;border:1px solid #efc9b2;background:#fff1e7;color:#9b4f26;font-weight:800;text-align:center;padding:13px;margin:0 0 14px;border-radius:12px;cursor:pointer;min-height:48px}.login-submit{width:100%;min-height:47px}.forgot-link:focus-visible{outline:3px solid #e97840}
</style></head><body><main><header><strong><img src="../assets/sadakatqr-icon.svg" alt=""> SadakatQR</strong><a href="../isletme/">İşletme paneli</a></header><section class="hero"><h1>FTMotion Ana Yönetim</h1><p>İşletme başvuruları ve onay işlemleri</p></section><section id="auth" class="box"><h2>Yönetici Girişi</h2><p>Yalnızca yönetici olarak yetkilendirilmiş hesaplar erişebilir.</p><form id="login"><label>E-posta<input id="email" type="email" autocomplete="email" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button type="button" id="forgot" class="forgot-link">🔑 Şifremi Unuttum / Şifre Oluştur</button><button class="button login-submit" type="submit">Giriş Yap</button></form><p id="msg" role="status"></p></section><section id="app"><div class="box toprow"><span id="adminEmail"></span><button id="logout" class="button" type="button">Çıkış Yap</button></div><div class="tabs"><button data-filter="pending" class="active">Onay Bekleyenler</button><button data-filter="approved">Onaylı</button><button data-filter="all">Tüm İşletmeler</button></div><p id="listStatus" role="status"></p><div id="list" class="cards"></div><button id="refresh" class="button" style="margin-top:18px">Listeyi Yenile</button></section></main><script>
const BASE='https://mplmmoehzsmohjikpqvj.supabase.co',KEY='sb_publishable_ER9usHRQGYTV9hG0eqZDpA_DnapX9qI',SESSION='sadakatqr_admin_session';let tokens=null,records=[],filter='pending';
const $=id=>document.getElementById(id);
async function api(path,method='GET',body){const h={'apikey':KEY,'Content-Type':'application/json'};if(tokens?.access_token)h.Authorization='Bearer '+tokens.access_token;const r=await fetch(BASE+path,{method,headers:h,body:body?JSON.stringify(body):undefined});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||x.msg||x.error_description||'İşlem başarısız');return x}
async function signIn(e){e.preventDefault();$('msg').textContent='Yetki kontrol ediliyor…';try{const t=await api('/auth/v1/token?grant_type=password','POST',{email:$('email').value.trim(),password:$('password').value});tokens=t;await validate()}catch(e){tokens=null;sessionStorage.removeItem(SESSION);$('msg').textContent='Giriş yapılamadı veya yönetici yetkisi bulunamadı: '+e.message}}
async function validate(){const user=await api('/auth/v1/user');const roles=await api('/rest/v1/loyalty_admins?select=user_id&user_id=eq.'+encodeURIComponent(user.id));if(!Array.isArray(roles)||roles.length!==1)throw Error('Giriş yapılan hesap: '+user.email+'. Yetkili yönetici: ftmotiondesign@gmail.com. Bu e-posta ile giriş yaptığından emin ol.');sessionStorage.setItem(SESSION,JSON.stringify(tokens));$('auth').style.display='none';$('app').style.display='block';$('adminEmail').textContent=user.email;await load()}
async function load(){try{$('listStatus').textContent='İşletmeler yükleniyor…';records=await api('/rest/v1/rpc/loyalty_admin_businesses','POST',{});render();$('listStatus').textContent=records.length+' işletme kaydı getirildi.'}catch(e){$('listStatus').textContent='Liste yüklenemedi: '+e.message}}
function render(){const list=$('list');list.replaceChildren();const subset=records.filter(x=>filter==='all'||x.status===filter);if(!subset.length){const d=document.createElement('div');d.className='empty';d.textContent='Bu bölümde kayıt bulunmuyor.';list.append(d);return}for(const b of subset){const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=b.name;const info=document.createElement('small');info.textContent='Başvuru: '+new Date(b.created_at).toLocaleString('tr-TR')+' · '+(b.phone||'Telefon yok');const status=document.createElement('span');status.className='status';status.textContent=({pending:'Onay bekliyor',approved:'Onaylı',suspended:'Askıda',rejected:'Reddedildi'})[b.status]||b.status;const a=document.createElement('div');a.className='actions';for(const [key,label] of [['approved','✓ Onayla'],['rejected','Reddet'],['suspended','Askıya Al'],['pending','Beklemeye Al']]){if(key===b.status)continue;const btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>setStatus(b,key);a.append(btn)}c.append(h,info,status,a);list.append(c)}}
async function setStatus(b,status){if(!confirm(b.name+' için durumu değiştirmek istiyor musun?'))return;try{await api('/rest/v1/rpc/loyalty_admin_set_status','POST',{p_business_id:b.id,p_status:status});await load()}catch(e){alert('İşlem yapılamadı: '+e.message)}}
$('forgot').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){$('msg').textContent='Önce e-posta adresini gir.';return}try{await api('/auth/v1/recover?redirect_to='+encodeURIComponent('https://ftmotiondesign.github.io/sadakatqr/'),'POST',{email});$('msg').textContent='Bu e-postaya ait hesap varsa şifre yenileme bağlantısı gönderildi. Yeni şifrenle buradan tekrar giriş yap.'}catch(e){$('msg').textContent='Şifre bağlantısı gönderilemedi: '+e.message}});
$('login').addEventListener('submit',signIn);$('logout').onclick=()=>{tokens=null;sessionStorage.removeItem(SESSION);$('app').style.display='none';$('auth').style.display='block';$('password').value=''};$('refresh').onclick=load;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
(async()=>{try{tokens=JSON.parse(sessionStorage.getItem(SESSION)||'null');if(tokens){if(tokens.expires_at&&Date.now()/1000>tokens.expires_at)throw Error('Expired');await validate()}}catch(e){tokens=null;sessionStorage.removeItem(SESSION)}})();
</script></body></html>
