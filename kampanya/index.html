<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SadakatQR · İşletme Kampanyaları</title><style>:root{font-family:system-ui,sans-serif;color:#39251e;background:#fff8f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:20px}.hero{background:linear-gradient(130deg,#58382d,#bc764e);color:white;border-radius:24px;padding:26px;margin:12px 0 20px}h1{font-size:28px;margin:10px 0}h2{font-size:19px}.muted{color:#816a5c}.card{background:white;border:1px solid #ebd6c5;border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 5px 18px #54302009}.tag{display:inline-block;background:#e6f7ec;color:#17713f;border-radius:50px;padding:5px 10px;font-size:12px;font-weight:700}.button{display:block;text-align:center;background:#d96e38;color:white;border:0;border-radius:13px;padding:14px;text-decoration:none;font-weight:800;margin-top:16px}.small{font-size:12px}.loading{padding:28px;text-align:center;background:white;border-radius:16px}footer{text-align:center;padding:24px;color:#947d70;font-size:12px}</style></head><body><main class="wrap"><header class="hero"><small>SADAKATQR · İŞLETME FIRSATLARI</small><h1 id="name">Kampanyalar</h1><div id="region"></div></header><h2>Aktif Kampanyalar</h2><p class="muted">Kampanyaları inceleyin, SadakatQR hesabınızla katılın ve damgalarınızı takip edin.</p><div id="campaigns" class="loading" role="status">İşletme ve kampanyalar yükleniyor…</div><footer>SadakatQR · Dijital Sadakat Kartı</footer></main><script>
const BASE='https://mplmmoehzsmohjikpqvj.supabase.co',KEY='sb_publishable_ER9usHRQGYTV9hG0eqZDpA_DnapX9qI';
const businessId=new URLSearchParams(location.search).get('isletme');
const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
async function load(){const root=document.getElementById('campaigns');if(!businessId||!valid.test(businessId)){root.textContent='Geçersiz işletme bağlantısı.';return}try{
const res=await fetch(BASE+'/rest/v1/rpc/loyalty_public_business_campaigns',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({p_business_id:businessId})});const data=await res.json();if(!res.ok)throw Error(data.message||'Kampanyalar yüklenemedi');
if(!Array.isArray(data)||!data.length){root.textContent='Bu işletme için şu anda aktif kampanya bulunmuyor veya işletme henüz onaylanmadı.';return}
document.getElementById('name').textContent=data[0].business_name;document.getElementById('region').textContent=[data[0].city,data[0].district,data[0].sector].filter(Boolean).join(' · ');
root.replaceChildren();root.className='';
for(const c of data){const article=document.createElement('article');article.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent='Aktif Kampanya';const h=document.createElement('h2');h.textContent=c.campaign_name;const p=document.createElement('p');p.className='muted';p.textContent=c.stamps_required+' damga ile ödül hakkı';const a=document.createElement('a');a.className='button';a.textContent='Kampanyaya Katıl ›';a.href='../?isletme='+encodeURIComponent(businessId)+'&kampanya='+encodeURIComponent(c.campaign_id);article.append(tag,h,p,a);root.append(article)}
}catch(e){root.textContent='Kampanyalar şu anda görüntülenemiyor. '+e.message}}
load();
</script></body></html>
