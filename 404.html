<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SadakatQR yönlendiriliyor</title><meta name="referrer" content="no-referrer"></head><body><p>SadakatQR uygulamasına yönlendiriliyorsunuz…</p><script>const dest='https://ftmotiondesign.github.io/sadakatqr/';const u=new URL(location.href);const allowed=['access_token','refresh_token','type','expires_in','error','error_description','code'];const q=new URLSearchParams();for(const k of allowed){if(u.searchParams.has(k))q.set(k,u.searchParams.get(k))}const next=dest+(q.toString()?'?'+q.toString():'')+u.hash;location.replace(next);</script><p><a href="https://ftmotiondesign.github.io/sadakatqr/">Uygulamaya dön</a></p></body></html>
